[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060
symmetric_transport=yes
external_media_address=172.20.1.186
external_signaling_address=172.20.1.186

[transport-tcp]
type=transport
protocol=tcp
bind=0.0.0.0:5060
symmetric_transport=yes
external_media_address=172.20.1.186
external_signaling_address=172.20.1.186

; Test softphone extension 1001
[1001]
type=endpoint
context=from-internal
disallow=all
allow=ulaw
allow=alaw
allow=gsm
auth=1001-auth
aors=1001
direct_media=no
force_rport=yes
rewrite_contact=yes
rtp_symmetric=yes
media_address=172.20.1.186
timers=no

[1001-auth]
type=auth
auth_type=userpass
username=1001
password=kisan1001

[1001]
type=aor
max_contacts=2
remove_existing=yes

; ============================================================
; Exotel / Cloud SIP Trunk Inbound Endpoint
; Handles SIP traffic from Exotel signaling proxies
; ============================================================
[exotel-trunk]
type=endpoint
context=from-exotel
disallow=all
allow=alaw
allow=ulaw
allow=gsm
direct_media=no
force_rport=yes
rewrite_contact=yes
rtp_symmetric=yes
timers=no

[exotel-identify]
type=identify
endpoint=exotel-trunk
match=pstn.in2.exotel.com,pstn.in1.exotel.com,103.241.136.0/22,103.25.130.0/23

