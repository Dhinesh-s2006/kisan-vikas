[general]
static=yes
writeprotect=no

[from-internal]

; Extension 1001: Softphone loopback
exten => 1001,1,Dial(PJSIP/1001,20)
 same => n,Hangup()

; Extension 999: Simple audio test
exten => 999,1,NoOp(=== Testing Simple Audio Playback ===)
 same => n,Answer()
 same => n,Wait(1)
 same => n,Playback(kisan/initial_lang)
 same => n,Wait(1)
 same => n,Hangup()

; ============================================================
; Extension 2000: NEW Kisan Queue IVR Entrypoint (Real Caller ID Implementation)
; Connects to dedicated FastAGI on port 4574
; ============================================================
exten => 2000,1,NoOp(=== [NEW-IVR] Call to 2000 num='${CALLERID(num)}' name='${CALLERID(name)}' ===)
 same => n,ExecIf($["${CALLERID(num)}" = "" | "${CALLERID(num)}" = "unknown"]?Set(CALLERID(num)=1001))
 same => n,Answer()
 same => n,Wait(1)
 same => n,AGI(agi://host.docker.internal:4574/ivr)
 same => n,GotoIf($["${AGISTATUS}" = "SUCCESS"]?done)
 same => n,NoOp([NEW-IVR] FastAGI returned ${AGISTATUS}, executing fallback)
 same => n,Playback(kisan/welcome)
 same => n(done),Hangup()


; Direct Phone Dialing Pattern for testing any caller phone from MicroSIP:
; e.g. Dial 2000*9000000016, 2000*+919000000016, or 2000*9999999999
exten => _2000*!,1,NoOp(=== [NEW-IVR] Direct Dialed Phone ${EXTEN:5} ===)
 same => n,Set(CALLERID(num)=${EXTEN:5})
 same => n,Answer()
 same => n,Wait(1)
 same => n,AGI(agi://host.docker.internal:4574/ivr)
 same => n,NoOp([NEW-IVR] FastAGI returned ${AGISTATUS})
 same => n,Hangup()

; Automated Test Extensions
; 2001: Unregistered Caller (9999999999)
exten => 2001,1,NoOp(=== [NEW-IVR] Unregistered Caller Test ===)
 same => n,Set(CALLERID(num)=9999999999)
 same => n,Answer()
 same => n,Wait(1)
 same => n,AGI(agi://host.docker.internal:4574/ivr)
 same => n,NoOp([NEW-IVR] FastAGI returned ${AGISTATUS})
 same => n,Hangup()

; 2002: Registered Farmer 9000000016 Automated Booking Test (DTMF 1)
exten => 2002,1,NoOp(=== [NEW-IVR] Farmer 9000000016 Booking Test ===)
 same => n,Set(CALLERID(num)=9000000016)
 same => n,Answer()
 same => n,Wait(1)
 same => n,AGI(agi://host.docker.internal:4574/ivr,1)
 same => n,NoOp([NEW-IVR] FastAGI returned ${AGISTATUS})
 same => n,Hangup()

; 2003: Registered Farmer 9000000016 Automated Status Test (DTMF 2)
exten => 2003,1,NoOp(=== [NEW-IVR] Farmer 9000000016 Status Test ===)
 same => n,Set(CALLERID(num)=9000000016)
 same => n,Answer()
 same => n,Wait(1)
 same => n,AGI(agi://host.docker.internal:4574/ivr,2)
 same => n,NoOp([NEW-IVR] FastAGI returned ${AGISTATUS})
 same => n,Hangup()

; ============================================================
; Inbound Telephony Context: Exotel / Cloud SIP Trunk
; Real Mobile Calls Arrive Here
; ============================================================
[from-exotel]
exten => _.,1,NoOp(=== [INBOUND-TELEPHONY] Incoming call from ${CALLERID(num)} to DID ${EXTEN} ===)
 same => n,Set(CLEAN_NUM=${FILTER(0123456789,${CALLERID(num)})})
 ; Strip country code 91 if present (12 digits -> 10 digits)
 same => n,ExecIf($["${CLEAN_NUM:0:2}" = "91" & ${LEN(${CLEAN_NUM})} = 12]?Set(CLEAN_NUM=${CLEAN_NUM:2}))
 ; Strip leading 0 if present (11 digits -> 10 digits)
 same => n,ExecIf($["${CLEAN_NUM:0:1}" = "0" & ${LEN(${CLEAN_NUM})} = 11]?Set(CLEAN_NUM=${CLEAN_NUM:1}))
 same => n,Set(CALLERID(num)=${CLEAN_NUM})
 same => n,NoOp(=== [INBOUND-TELEPHONY] Normalized Caller Phone: ${CALLERID(num)} -> Routing to 2000 ===)
 same => n,Goto(from-internal,2000,1)
